name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/*.apk free-will-lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: free-will-lab-apk
          path: free-will-lab.apk
          if-no-files-found: error

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create latest free-will-lab.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Free Will Lab (latest Android APK)" \
            --notes "Download free-will-lab.apk below and open it on your Android phone. Built from commit ${GITHUB_SHA::7}."
